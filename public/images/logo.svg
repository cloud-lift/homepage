    <path d="M18 35C14.6863 35 12 32.3137 12 29C12 25.6863 14.6863 23 18 23C18.3526 23 18.6992 23.0264 19.0377 23.0773C19.5549 18.6402 23.3493 15.25 28 15.25C33.1086 15.25 37.25 19.3914 37.25 24.5C37.25 24.8343 37.2297 25.1636 37.1904 25.4868C40.3409 26.4233 42.5 29.3137 42.5 32.75C42.5 37.0302 39.0302 40.5 34.75 40.5H18Z" fill="url(#gradient1)" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Code brackets in cloud -->
    <path d="M23 28L20.5 30.5L23 33" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M31 28L33.5 30.5L31 33" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28.5 26.5L25.5 34.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- PLN text in white and red -->
  <g id="pln-text">
    <text x="52" y="38" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-size="32" font-weight="700" fill="white">P</text>
    <text x="75" y="38" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-size="32" font-weight="700" fill="white">L</text>
    <text x="97" y="38" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-size="32" font-weight="700" fill="#dc5f5f">N</text>
  </g>

  <!-- Cloud text -->
  <g id="cloud-text">
    <text x="130" y="38" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-size="32" font-weight="500" fill="white" opacity="0.95">Cloud</text>
  </g>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradient1" x1="12" y1="15.25" x2="42.5" y2="40.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#667eea"/>
